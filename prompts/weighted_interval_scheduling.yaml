  import numpy as np
  import pandas as pd

  sched_items = pd.DataFrame(index = ["a", "b", "c", "d", "e", "f", "g", "h"])
  sched_items["start_time"] = [0, 1, 3, 3, 4, 5, 6, 8]
  sched_items["end_time"] = [6, 4, 5, 8, 7, 9, 6, 11]
  sched_items["weight"] = [3, 8, 5, 14, 7, 3, 10, 2]

  sched_items
  ```

# Output varies (random instances) — just verify the code runs cleanly.
